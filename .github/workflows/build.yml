name: Build Windows app

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build YTGuy.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --noconsole --name YTGuy --icon app.ico --add-data "web;web" server.py
      - uses: actions/upload-artifact@v4
        with:
          name: YTGuy-windows
          path: dist/YTGuy.exe
      # Publish as the "latest" release so the website's download button
      # (releases/latest/download/YTGuy.exe) always serves the newest build.
      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/YTGuy.exe --target "$GITHUB_SHA" --latest \
            --title "YTGuy for Windows" \
            --notes "Download **YTGuy.exe**, run it, then use the website: https://froodyofficial-maker.github.io/ytguy/ (it also opens its own page). Built from ${GITHUB_SHA::7}."
