name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build YTGuy.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --noconsole --name YTGuy --icon app.ico --add-data "web;web" server.py
      - uses: actions/upload-artifact@v4
        with:
          name: YTGuy-windows
          path: dist/YTGuy.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YTGuy.exe
